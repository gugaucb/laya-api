[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "laya-api"
version = "0.1.0"
description = "Ultra-Fast OpenAI & Anthropic-Compatible Inference Server for Laya & Laya-MLX Models"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
authors = [
    { name = "Laya API Contributors" }
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Operating System :: OS Independent",
]
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.28.0",
    "pydantic>=2.6.0",
    "typer>=0.12.0",
    "websockets>=12.0",
    "httpx>=0.27.0",
]

[project.optional-dependencies]
mlx = [
    "mlx>=0.10.0; sys_platform == 'darwin'",
    "laya-mlx>=0.1.0; sys_platform == 'darwin'"
]
torch = [
    "torch>=2.2.0",
    "transformers>=4.38.0",
    "laya>=0.1.0"
]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=4.1.0",
]

[project.scripts]
laya-api = "laya_api.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
