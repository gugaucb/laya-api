name: Publish Docker Images to Docker Hub

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      version_tag:
        description: "Custom version tag (e.g., v0.1.0)"
        required: false
        default: "latest"

env:
  DOCKER_IMAGE_NAME: "gugaucb/laya-api"

jobs:
  build-and-push-cpu:
    name: Build & Push CPU Image (Multi-Arch)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract Tag / Version
        id: meta
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ github.event.inputs.version_tag }}"
          else
            TAG="${GITHUB_REF#refs/tags/}"
          fi
          echo "TAG=$TAG" >> $GITHUB_OUTPUT

      - name: Set up QEMU (for Multi-Arch builds)
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build & Push CPU Multi-Arch Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./docker/Dockerfile.cpu
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.DOCKER_IMAGE_NAME }}:latest
            ${{ env.DOCKER_IMAGE_NAME }}:${{ steps.meta.outputs.TAG }}
            ${{ env.DOCKER_IMAGE_NAME }}:cpu
            ${{ env.DOCKER_IMAGE_NAME }}:${{ steps.meta.outputs.TAG }}-cpu
          cache-from: type=gha
          cache-to: type=gha,mode=max

  build-and-push-cuda:
    name: Build & Push NVIDIA CUDA Image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract Tag / Version
        id: meta
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ github.event.inputs.version_tag }}"
          else
            TAG="${GITHUB_REF#refs/tags/}"
          fi
          echo "TAG=$TAG" >> $GITHUB_OUTPUT

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build & Push CUDA Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./docker/Dockerfile.cuda
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.DOCKER_IMAGE_NAME }}:cuda
            ${{ env.DOCKER_IMAGE_NAME }}:${{ steps.meta.outputs.TAG }}-cuda
          cache-from: type=gha
          cache-to: type=gha,mode=max
